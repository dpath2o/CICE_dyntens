[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CICE_testing"
version = "0.1.0"
description = "CICE box and global-grid validation, workflows and evidence figures"
requires-python = ">=3.10"
dependencies = ["numpy", "netCDF4"]

[project.optional-dependencies]
figures = ["pygmt>=0.11", "xarray", "nbformat", "ipykernel"]
test = ["pytest", "nbclient"]

[project.scripts]
cice-test-restart = "CICE_testing.workflows.restart:main"
cice-test-invalid = "CICE_testing.workflows.invalid_state:main"
cice-test-box = "CICE_testing.workflows.box:main"
cice-test-candidates = "CICE_testing.validation.candidates:main"
cice-test-spatial = "CICE_testing.validation.spatial:main"
cice-test-fsd = "CICE_testing.validation.fsd:main"
cice-test-mapping = "CICE_testing.workflows.fortran_mapping:main"
cice-test-fixtures = "CICE_testing.workflows.fortran_fixtures:main"
cice-test-figures = "CICE_testing.plotting.validation:main"

[tool.setuptools]
package-dir = {"CICE_testing" = "."}
packages = ["CICE_testing", "CICE_testing.core", "CICE_testing.validation", "CICE_testing.workflows", "CICE_testing.plotting", "CICE_testing.resources"]

[tool.setuptools.package-data]
CICE_testing = ["resources/*.F90"]
